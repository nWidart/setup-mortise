name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck setup.sh tests/make-fixture-release.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # The main and post steps in Node 24, the version the runner runs the action with. On Windows the
  # tests that need a shell script as a fake mortise skip; the fixture job runs the real binary there.
  unit:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test tests/post.test.js

  # Until a release of mortise-dev/mortise carries the command line tool, the action is tested against a
  # fixture release: a binary built from a pinned commit of Mortise, packed and summed as a release
  # does, served from file:// through SETUP_MORTISE_BASE_URL.
  fixture:
    name: Fixture release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    env:
      MORTISE_COMMIT: e3e8af9a534c5f133aabed40867b67ef0a0c3eb8
    steps:
      - uses: actions/checkout@v5
        with:
          path: action
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: mortise-dev/mortise
          ref: ${{ env.MORTISE_COMMIT }}
          path: mortise
          persist-credentials: false
      - name: Install rustup
        run: |
          if ! command -v rustup > /dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
      - name: Build mortise
        working-directory: mortise
        run: |
          rustup toolchain install --profile minimal
          cargo build --locked -p mortise-cli
      - name: Make the fixture release
        id: fixture
        run: |
          binary=mortise/target/debug/mortise
          if [ "$RUNNER_OS" = Windows ]; then binary=$binary.exe; fi
          folder="$RUNNER_TEMP/fixture"
          tag=$(action/tests/make-fixture-release.sh "$binary" "$folder")
          if [ "$RUNNER_OS" = Windows ]; then url="file:///$(cygpath -m "$folder")"; else url="file://$folder"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Run the action
        id: setup
        uses: ./action
        with:
          version: ${{ steps.fixture.outputs.tag }}
        env:
          SETUP_MORTISE_BASE_URL: ${{ steps.fixture.outputs.url }}
      - name: Check mortise is on PATH
        env:
          TAG: ${{ steps.fixture.outputs.tag }}
          OUTPUT: ${{ steps.setup.outputs.version }}
        run: |
          test "$OUTPUT" = "$TAG"
          test "$(mortise --version)" = "mortise ${TAG#v}"
          status=0
          mortise check mortise/fixtures/shop-api > /dev/null || status=$?
          test "$status" -eq 1

      # The post step with the binary the action installed, as on a push to the default branch. The
      # checkout of mortise is shallow, so mortise backfill sends nothing, says why and exits 0.
      - name: Check the post step runs the installed mortise
        env:
          MORTISE_TOKEN: mrt_not_a_real_token
          MORTISE_CLOUD_URL: http://127.0.0.1:9
          TAG: ${{ steps.fixture.outputs.tag }}
        run: |
          installed=$(command -v mortise)
          if [ "$RUNNER_OS" = Windows ]; then installed=$(cygpath -w "$installed"); fi
          echo '{"repository":{"default_branch":"main"}}' > "$RUNNER_TEMP/push.json"
          mkdir -p "$RUNNER_TEMP/elsewhere"
          printed=$(
            cd "$RUNNER_TEMP/elsewhere" &&
              INPUT_BACKFILL=true INPUT_PATH=mortise \
                GITHUB_EVENT_NAME=push GITHUB_REF=refs/heads/main GITHUB_EVENT_PATH="$RUNNER_TEMP/push.json" \
                STATE_mortise="$installed" STATE_version="$TAG" node "$GITHUB_WORKSPACE/action/post.js" 2>&1
          )
          echo "$printed"
          grep -q 'backfill needs the full history' <<<"$printed"
          if grep -q -e '::warning::' -e "$MORTISE_TOKEN" <<<"$printed"; then exit 1; fi
      - name: Check the post step prints nothing on a pull request
        env:
          MORTISE_TOKEN: mrt_not_a_real_token
          TAG: ${{ steps.fixture.outputs.tag }}
        run: |
          printed=$(
            INPUT_BACKFILL=true GITHUB_EVENT_NAME=pull_request GITHUB_REF=refs/pull/1/merge \
              STATE_mortise="$(command -v mortise)" STATE_version="$TAG" node action/post.js 2>&1
          )
          test -z "$printed"

      # The post step of this run, with backfill: true: it runs at the end of the job, after the
      # step below has changed PATH and the working directory. On a pull request it prints nothing;
      # on a push to main it reads the shallow checkout of the action and exits 0.
      - name: Run the action with backfill
        uses: ./action
        with:
          version: ${{ steps.fixture.outputs.tag }}
          backfill: true
          path: action
        env:
          SETUP_MORTISE_BASE_URL: ${{ steps.fixture.outputs.url }}
          MORTISE_TOKEN: mrt_not_a_real_token
          MORTISE_CLOUD_URL: http://127.0.0.1:9
      - name: Change PATH and the working directory
        run: |
          mkdir -p "$RUNNER_TEMP/other-bin"
          echo "$RUNNER_TEMP/other-bin" >> "$GITHUB_PATH"
          cd "$RUNNER_TEMP"

      - name: Change the archive's line in the sums file
        env:
          TAG: ${{ steps.fixture.outputs.tag }}
        run: |
          sums="$RUNNER_TEMP/fixture/$TAG/Mortise-$TAG-SHA256SUMS.txt"
          # sha256sum on Windows marks binary mode with "*" before the name.
          sed -i.orig 's/^[0-9a-f]\{8\}\([0-9a-f]\{56\} [ *]mortise-\)/00000000\1/' "$sums"
          ! cmp -s "$sums" "$sums.orig"
      - name: Run the action on the changed release
        id: changed
        continue-on-error: true
        uses: ./action
        with:
          version: ${{ steps.fixture.outputs.tag }}
        env:
          SETUP_MORTISE_BASE_URL: ${{ steps.fixture.outputs.url }}
      - name: Check the action failed
        env:
          OUTCOME: ${{ steps.changed.outcome }}
        run: test "$OUTCOME" = failure

  # Against a real release of mortise-dev/mortise. It waits for the first release that carries the command
  # line tool: set the repository variable MORTISE_RELEASE to its tag, such as v0.3.0, to run it.
  release:
    name: Release ${{ vars.MORTISE_RELEASE }} (${{ matrix.os }})
    if: vars.MORTISE_RELEASE != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: pinned
        uses: ./
        with:
          version: ${{ vars.MORTISE_RELEASE }}
      - env:
          TAG: ${{ vars.MORTISE_RELEASE }}
        run: test "$(mortise --version)" = "mortise ${TAG#v}"
      - id: latest
        uses: ./
      - run: mortise --version
