name: Set up Mortise
description: Install mortise, the command line tool of Mortise, from a GitHub release, after checking its SHA-256.
author: Nicolas Widart
branding:
  icon: check-square
  color: green

inputs:
  version:
    description: The release to install, such as v0.3.0 or 0.3.0. latest installs the newest release.
    required: false
    default: latest
  token:
    description: A token for the GitHub API. It is used only to find the newest release when version is latest.
    required: false
    default: ${{ github.token }}
  backfill:
    description: true runs mortise backfill after the steps of the job, on a push to the default branch when MORTISE_TOKEN is set. Needs Mortise 1.3.0 or later.
    required: false
    default: 'false'
  path:
    description: The app folder that mortise backfill reads, relative to the workspace.
    required: false
    default: .

outputs:
  version:
    description: The tag of the installed release, such as v0.3.0.

runs:
  using: node24
  main: main.js
  post: post.js
  post-if: '!cancelled()'
